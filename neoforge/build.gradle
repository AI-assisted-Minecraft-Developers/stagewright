plugins {
    // java-library for the `api` configuration, which ModDevGradle does not add.
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'stagewright.mod'
    id 'com.gradleup.shadow'
}

neoForge {
    version = rootProject.neoforge_version
    addModdingDependenciesTo(sourceSets.test)
}

base {
    archivesName = 'mc_stagewright-neoforge'
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // api's and common's jars go into this mod's jar whole; NeoForge runs in Mojang names, so nothing is remapped.
    implementation(project(':stagewright-api')) { transitive = false }
    implementation(project(':stagewright-common')) { transitive = false }
    shadowBundle(project(':stagewright-api')) { transitive = false }
    shadowBundle(project(':stagewright-common')) { transitive = false }
    shadowBundle "org.yaml:snakeyaml:$rootProject.snakeyaml_version"

    // The JUnit Platform the in-game test runner uses, nested (Jar-in-Jar) as libraries.
    junitPlatformJars.each { jarJar(it) { transitive = false } }

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The pin the metadata was rendered from, which -Pworlddriver_version may override.
    systemProperty 'stagewright.worlddriverDependency', rootProject.worlddriver_version
}

processResources {
    def metadata = [
        version                  : project.version,
        mod_id                   : rootProject.mod_id,
        mod_name                 : rootProject.mod_name,
        mod_license              : rootProject.mod_license,
        mod_authors              : rootProject.mod_authors,
        mod_description          : rootProject.mod_description,
        loader_version_range     : rootProject.loader_version_range,
        neoforge_version_range   : rootProject.neoforge_version_range,
        minecraft_version_range  : rootProject.minecraft_version_range,
        worlddriver_version_range: rootProject.worlddriverVersionRange,
    ]
    inputs.properties metadata

    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}

// `jar` holds this module's own classes, published as `dev` beside the Mojang-named jars of api and common.
tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

shadowJar {
    configurations = [
        project.configurations.shadowBundle
    ]
    // The mod jar. ModDevGradle nests the jarJar output into `jar` only, so it is added here too.
    archiveClassifier = ''
    from(tasks.named('jarJar'))
    // api and this module both ship capability providers in META-INF/services; merge them, not keep the last
    // (docs/design/capability-extensions.md). Shadow 9 hands a transformer only the duplicates the strategy keeps.
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    // Another mod may ship its own snakeyaml.
    relocate 'org.yaml.snakeyaml', 'net.magicterra.stagewright.shadow.snakeyaml'
    into('META-INF/licenses') {
        from rootProject.file('cli/src/main/resources/META-INF/licenses/Apache-2.0.txt')
    }
}

tasks.named('assemble') { dependsOn 'shadowJar' }

// Published as the mod jar and as `dev-shadow` alike: NeoForge runs in Mojang names, so nothing is remapped.
ext.shippedJar = tasks.named('shadowJar')
ext.devJar = tasks.named('jar')
ext.devShadowJar = tasks.named('shadowJar')
