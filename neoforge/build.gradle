plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

base {
    archivesName = 'mc_stagewright-neoforge'
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Plain project dependency — :stagewright-attached is not a loom module, so it has no
    // `namedElements` / `transformProduction*` configurations to ask for (nothing Minecraft to
    // remap). Bundled all the same: its classes are on the api's public surface.
    compileOnly project(':stagewright-attached')
    shadowBundle project(':stagewright-attached')

    common(project(path: ':stagewright-api', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':stagewright-api', configuration: 'transformProductionNeoForge')

    common(project(path: ':stagewright-common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':stagewright-common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Load-bearing. Capability providers arrive through META-INF/services, and that path now exists
    // in BOTH :stagewright-api (the shipped Curios/FTB Quests adapters) and this module. Shadow's
    // default is last-writer-wins per path, so without this the jar ships one file and every
    // provider in the other reports itself absent — which is indistinguishable from an uninstalled
    // mod, and would be found by a scene skipping for a reason that is not true.
    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    runs {
        stagewrightServer {
            server()
            property 'stagewright.autorun', 'true'
            runDir 'run-stagewright'
        }
    }
    runConfigs.configureEach {
        vmArg '-Xmx1g'
    }
}
