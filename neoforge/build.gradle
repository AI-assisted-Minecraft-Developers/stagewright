plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

base {
    archivesName = 'mc_stagewright-neoforge'
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Plain project dependency — :stagewright-attached is not a loom module, so it has no
    // `namedElements` / `transformProduction*` configurations to ask for (nothing Minecraft to
    // remap). Bundled all the same: its classes are on the api's public surface.
    compileOnly project(':stagewright-attached')
    shadowBundle project(':stagewright-attached')

    common(project(path: ':stagewright-api', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':stagewright-api', configuration: 'transformProductionNeoForge')

    common(project(path: ':stagewright-common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':stagewright-common', configuration: 'transformProductionNeoForge')

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

processResources {
    def metadata = [
            version                : project.version,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_license            : rootProject.mod_license,
            mod_authors            : rootProject.mod_authors,
            mod_description        : rootProject.mod_description,
            loader_version_range   : rootProject.loader_version_range,
            neoforge_version_range : rootProject.neoforge_version_range,
            minecraft_version_range: rootProject.minecraft_version_range,
    ]
    inputs.properties metadata

    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Load-bearing. Capability providers arrive through META-INF/services, and that path now exists
    // in BOTH :stagewright-api (the shipped Curios/FTB Quests adapters) and this module. Shadow's
    // default is last-writer-wins per path, so without this the jar ships one file and every
    // provider in the other reports itself absent — which is indistinguishable from an uninstalled
    // mod, and would be found by a scene skipping for a reason that is not true.
    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    runs {
        stagewrightServer {
            server()
            property 'stagewright.autorun', 'true'
            runDir 'run-stagewright'
        }
    }
    runConfigs.configureEach {
        vmArg '-Xmx1g'
    }
}
