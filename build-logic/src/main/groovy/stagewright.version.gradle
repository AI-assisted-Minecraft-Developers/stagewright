// <base>-alpha.<BUILD_NUMBER>+<minecraft>, or -snapshot without BUILD_NUMBER (docs/reference/publishing.md, Versions).
def buildNumber = providers.environmentVariable('BUILD_NUMBER').orNull
// A SemVer numeric identifier, so the version orders by run number.
if (buildNumber != null && !(buildNumber ==~ /0|[1-9][0-9]*/)) {
    throw new GradleException("BUILD_NUMBER is '${buildNumber}', but it must be a whole number"
    + " without leading zeros; unset it for a local build")
}
def prerelease = buildNumber != null ? "alpha.${buildNumber}" : 'snapshot'

// The base version and the Minecraft line are the root gradle.properties' own.
def rootProperties = new Properties()
new File(StageWrightRepo.ROOT, 'gradle.properties').withInputStream {
    rootProperties.load(it)
}
ext.stagewrightVersion = "${rootProperties.mod_base_version}-${prerelease}+${rootProperties.minecraft_version}".toString()
ext.junitVersion = rootProperties.junit_version
// The WorldDriver StageWright builds against; -Pworlddriver_version overrides it.
ext.worlddriverDependency = (findProperty('worlddriver_version') ?: rootProperties.worlddriver_version).toString()

// The WorldDriver versions StageWright links against, up to the next breaking release, declared by both loaders'
// metadata and checked by the Gradle plugin. Why each bound ends in -alpha.0: docs/reference/publishing.md, Versions.
ext.worlddriverVersionRange = {
    def m = worlddriverDependency =~ /^(\d+)\.(\d+)\.(\d+)/
    if (!m.find()) throw new GradleException("worlddriver_version is not major.minor.patch: '$worlddriverDependency'")
    int major = m.group(1) as int
    int minor = m.group(2) as int
    def numbered = worlddriverDependency =~ /^\d+\.\d+\.\d+-alpha\.\d+(?=\+|$)/
    def floor = numbered.find() ? numbered.group() : "${m.group()}-alpha.0"
    // Its own variable: the Groovy-Eclipse formatter cannot parse a quoted string nested in a ${} expression.
    def ceiling = major == 0 ? "0.${minor + 1}.0" : "${major + 1}.0.0"
    "[${floor},${ceiling}-alpha.0)".toString()
}()
ext.rhinoVersion = rootProperties.rhino_version
ext.snakeyamlVersion = rootProperties.snakeyaml_version
