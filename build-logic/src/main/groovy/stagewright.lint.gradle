// Layout, for every project of all three builds: Spotless alone owns it. Checkstyle and PMD judge the rest.
// See docs/reference/code-style.md.
plugins {
    id 'com.diffplug.spotless'
}

def configDir = new File(StageWrightRepo.ROOT, 'config')
// The vendored minimal-json is kept verbatim (engine/.../engine/json/VENDORED.md): no tool here touches or judges it.
def vendored = '**/engine/json/**'

// What this project's formatter steps leave alone: tool output, and the files of nested projects and other builds,
// which format their own.
def notMine = [
    vendored,
    '**/build/**',
    '**/.gradle/**',
    '**/node_modules/**',
    '.idea/**',
    'run/**',
    'run-*/**',
    'gradle/wrapper/**'
]
def here = projectDir.toPath()
rootProject.allprojects.findAll {
    it != project && it.projectDir.toPath().startsWith(here)
}.each {
    notMine << here.relativize(it.projectDir.toPath()).toString() + '/**'
}
if (projectDir == StageWrightRepo.ROOT) {
    // The engine build (engine, agent, testengine) and the Gradle plugin's build.
    notMine += [
        'engine/**',
        'agent/**',
        'testengine/**',
        'gradle-plugin/**'
    ]
}
def mine = { List<String> patterns ->
    fileTree(projectDir) {
        include patterns
        exclude notMine
    }
}

spotless {
    plugins.withId('java') {
        java {
            targetExclude vendored
            palantirJavaFormat('2.103.0').formatJavadoc(true)
        }
    }
    groovyGradle {
        target mine(['**/*.gradle'])
        greclipse().configFile(new File(configDir, 'spotless/greclipse.properties'))
    }
    def scripts = mine(['src/**/*.js'])
    if (!scripts.isEmpty()) {
        javascript {
            target scripts
            prettier('3.6.2').config([printWidth: 120, tabWidth: 4, trailingComma: 'es5'])
        }
    }
    format 'misc', {
        target mine([
            '**/*.md',
            '**/*.properties',
            '**/*.yml',
            '**/*.yaml',
            '**/*.json',
            '**/*.toml',
            '**/*.mcmeta',
            '**/*.cfg',
            'config/**/*.xml'
        ])
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
}

// Checkstyle and PMD, on main sources only. They report without failing until today's findings are fixed.
plugins.withId('java') {
    pluginManager.apply('checkstyle')
    pluginManager.apply('pmd')
    project.checkstyle {
        toolVersion = '14.3.0'
        configDirectory = new File(configDir, 'checkstyle')
        sourceSets = [project.sourceSets.main]
        ignoreFailures = true
    }
    project.pmd {
        toolVersion = '7.29.0'
        ruleSets = []
        ruleSetFiles = project.files(new File(configDir, 'pmd/ruleset.xml'))
        sourceSets = [project.sourceSets.main]
        ignoreFailures = true
    }
    tasks.withType(Checkstyle).configureEach { exclude vendored }
    tasks.withType(Pmd).configureEach { exclude vendored }
}
