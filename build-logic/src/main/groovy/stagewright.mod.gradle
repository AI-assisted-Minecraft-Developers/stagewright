// A Minecraft-side module (api, common, fabric, neoforge), applied after `java-library` and its loader plugin.
pluginManager.apply('maven-publish')
pluginManager.apply('stagewright.module')

def module = project

// The JUnit Platform the in-game runner uses, each jar named: Loom's `include` is not transitive, and the
// NeoForge jarJar takes each one alone.
// Jupiter 5.x ships with Platform 1.x of the same minor and patch.
def junitPlatformVersion = rootProject.junit_version.replaceFirst(/^5\./, '1.')
ext.junitPlatformJars = [
    "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}",
    "org.junit.platform:junit-platform-engine:${junitPlatformVersion}",
    "org.junit.platform:junit-platform-commons:${junitPlatformVersion}",
    "org.junit.platform:junit-platform-reporting:${junitPlatformVersion}",
    "org.junit.jupiter:junit-jupiter-engine:${rootProject.junit_version}",
    "org.junit.jupiter:junit-jupiter-api:${rootProject.junit_version}",
    "org.junit.jupiter:junit-jupiter-params:${rootProject.junit_version}",
    'org.opentest4j:opentest4j:1.3.0',
    'org.apiguardian:apiguardian-api:1.1.2',
]

base {
    archivesName = "$rootProject.archives_name-$project.name"
}

pluginManager.apply('stagewright.driver')

repositories {
    mavenCentral()
    // Rhino (KubeJS fork), not on Maven Central. Fenced to its group: a host that answers 200 to any path would
    // otherwise serve bogus POMs for everything not found earlier.
    maven {
        name = 'latvian-releases'
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
}

java {
    withSourcesJar()
    // Compiles and runs the game on 21 whatever JDK runs Gradle itself.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // The artifacts are each module's own, attached below once its script has named them.

            // No dependencies but those a module lists in ext.pomKeeps ('group:artifact'): a mod jar nests its own
            // (docs/reference/publishing.md).
            pom.withXml {
                def keep = module.findProperty('pomKeeps') ?: []
                def kept = module.configurations.api.dependencies.findAll {
                    "${it.group}:${it.name}".toString() in keep
                }
                if (kept.isEmpty()) {
                    return
                }
                def block = asNode().appendNode('dependencies')
                kept.each { d ->
                    def node = block.appendNode('dependency')
                    node.appendNode('groupId', d.group)
                    node.appendNode('artifactId', d.name)
                    node.appendNode('version', d.version)
                    def classifier = d instanceof ModuleDependency ? d.artifacts.find()?.classifier : null
                    if (classifier) {
                        node.appendNode('classifier', classifier)
                    }
                    node.appendNode('scope', 'compile')
                }
            }
        }
    }

    // After the module's script, which sets archivesName and names its jars: `shippedJar` (the plain artifact),
    // `devJar` (Mojang names) and `devShadowJar` (a loader's whole mod in Mojang names).
    afterEvaluate {
        publishing.publications.named('mavenJava') {
            artifactId = base.archivesName.get()
            if (project.ext.has('shippedJar')) {
                artifact(project.ext.shippedJar)
            }
            artifact(project.ext.devJar) { classifier = 'dev' }
            if (project.ext.has('devShadowJar')) {
                artifact(project.ext.devShadowJar) { classifier = 'dev-shadow' }
            }
            artifact(project.ext.has('sourcesJarTask') ? project.ext.sourcesJarTask : tasks.named('sourcesJar')) {
                classifier = 'sources'
            }
        }
    }

    // Gradle consumers prefer .module metadata over the POM, and the runtimeElements
    // variant would leak the dependencies the POM deliberately strips.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    repositories {
        mavenLocal()
    }
}
