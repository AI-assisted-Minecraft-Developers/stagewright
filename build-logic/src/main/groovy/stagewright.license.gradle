// The LGPL-3.0-only terms, on every jar and POM (docs/reference/publishing.md).
def repoRoot = StageWrightRepo.ROOT

// Both files: COPYING.LESSER only adds permissions to COPYING. Not shadowJar, whose bundled jars carry them already
// and which would write them twice.
tasks.withType(Jar).matching { it.name != 'shadowJar' }.configureEach {
    into('META-INF') {
        from(new File(repoRoot, 'COPYING'))
        from(new File(repoRoot, 'COPYING.LESSER'))
    }
}

plugins.withId('maven-publish') {
    publishing.publications.withType(MavenPublication).configureEach {
        pom {
            url = 'https://github.com/AI-assisted-Minecraft-Developers/stagewright'
            licenses {
                license {
                    name = 'LGPL-3.0-only'
                    url = 'https://www.gnu.org/licenses/lgpl-3.0.txt'
                }
            }
            scm {
                url = 'https://github.com/AI-assisted-Minecraft-Developers/stagewright'
                connection = 'scm:git:https://github.com/AI-assisted-Minecraft-Developers/stagewright.git'
            }
        }
    }
}
