// Where CI publishes each development build. Applied beside `maven-publish`; the credentials are
// taken from the environment as it is applied, and only a task that publishes here needs them.
plugins {
    id 'maven-publish'
}

publishing {
    repositories {
        maven {
            name = 'gardelNexus'
            url = 'https://nexus.gardel.top/repository/maven-releases'
            credentials {
                username = System.getenv('MAVEN_USERNAME')
                password = System.getenv('MAVEN_PASSWORD')
            }
        }
    }
}

// Only CI's numbered builds: a release version cannot be deployed twice. Read lazily, after the script sets it.
def publishedVersion = provider { project.version.toString() }
tasks.withType(PublishToMavenRepository)
        .matching {
            it.name.endsWith('ToGardelNexusRepository')
        }.configureEach {
            def versionToCheck = publishedVersion
            doFirst {
                def published = versionToCheck.get()
                if (!(published ==~ /.*-alpha\.[0-9]+\+.*/)) {
                    throw new GradleException("${published} is not published to the Nexus: only a build"
                    + " numbered by BUILD_NUMBER goes there."
                    + " Use publishToMavenLocal for a local build.")
                }
            }
        }
