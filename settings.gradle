// worlddriver consumes these modules only as published artifacts; see docs/reference/publishing.md.
pluginManagement {
    includeBuild('build-logic')

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        gradlePluginPortal()
    }
}

rootProject.name = 'stagewright'

// Each module applies its own convention plugin: only the four Minecraft-side ones take Loom or ModDevGradle.
[
    'stagewright-api': 'api',
    'stagewright-common': 'common',
    'stagewright-fabric': 'fabric',
    'stagewright-neoforge': 'neoforge',
    'stagewright-cli': 'cli',
    'stagewright-engine': 'engine',
    'stagewright-agent': 'agent',
    'stagewright-testengine': 'testengine',
    'stagewright-gradle-plugin': 'gradle-plugin',
].each { name, dir ->
    include name
    project(":${name}").projectDir = file(dir)
}
