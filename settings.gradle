// StageWright — build settings.
//
// worlddriver is a separate repository and build; it consumes these modules only as published
// artifacts (see RELEASE ORDER in build.gradle), so nothing here has to resolve inside its build.
pluginManagement {
    // The gradle plugin is its own build. worlddriver, its first consumer, resolves it from
    // mavenLocal by version instead.
    includeBuild('gradle-plugin')

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'stagewright'

include 'stagewright-attached'
include 'stagewright-api'
include 'stagewright-common'
include 'stagewright-fabric'
include 'stagewright-neoforge'
include 'stagewright-junit'
project(':stagewright-attached').projectDir = file('attached')
project(':stagewright-api').projectDir = file('api')
project(':stagewright-common').projectDir = file('common')
project(':stagewright-fabric').projectDir = file('fabric')
project(':stagewright-neoforge').projectDir = file('neoforge')
project(':stagewright-junit').projectDir = file('junit')
