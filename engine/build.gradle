// Run preparation, game supervision and JSON, shared by the Gradle plugin, the CLI and the test engine.
// No external dependencies: it lands on a consumer's buildscript classpath (src/main/java/.../engine/json/VENDORED.md).
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'stagewright.module'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // ArchitectureTest: what the engine and the agent may depend on.
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The supervision tests start a real JVM with the real agent.
    def agentJar = project(':stagewright-agent').tasks.named('jar', Jar)
    dependsOn agentJar
    // An input, not only a path in a property: otherwise a changed agent leaves these tests up to date.
    inputs.file(agentJar.flatMap { it.archiveFile })
    systemProperty 'stagewright.agentJar', agentJar.get().archiveFile.get().asFile.absolutePath
    systemProperty 'stagewright.testClasses', sourceSets.test.output.classesDirs.asPath
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'stagewright-engine'
        }
    }
    repositories {
        mavenLocal()
    }
}
