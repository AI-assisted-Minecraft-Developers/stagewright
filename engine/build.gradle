// The parts of a StageWright run that are neither Gradle nor Minecraft.
//
// Judging a results file, and preparing the directory a run happens in, are the same work whether
// the run was started by the Gradle plugin against a dev task or by the CLI against an installed
// modpack. Holding them once is not tidiness: two implementations of the verdict rules would
// eventually disagree about the same results file, and nothing would say which was right. This
// repository already paid that bill once — the Python orchestrators it is retiring were exactly
// that second implementation.
//
// NO EXTERNAL DEPENDENCIES, and that constraint is inherited rather than chosen. This artifact
// lands on a consumer's BUILDSCRIPT classpath through the gradle plugin, where a third-party
// coordinate has to resolve from whatever `pluginManagement { repositories }` the consumer happens
// to have — worlddriver's lists no Maven Central at all.
//
// That is an argument against DEPENDING on a JSON library, not against USING one, and the two were
// conflated here until a hand-written parser sat under the verdict. The library is vendored instead:
// see src/main/java/.../engine/json/VENDORED.md.
//
// Relocating a real dependency with Shadow was measured as the alternative. It works only with
// deliberate wiring — composite-build substitution resolves `runtimeElements`, i.e. the plain `jar`,
// so with the obvious configuration the plugin still gets the unrelocated library as a transitive
// dependency and the published POM still declares it. Worth revisiting if this module ever needs
// several third-party libraries; overkill for one.
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'net.magicterra'
version = '0.1.0'

apply from: '../gradle/license.gradle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'stagewright-engine'
        }
    }
    repositories {
        mavenLocal()
    }
}
