// StageWright engine — standalone build, deliberately.
//
// Not a subproject of the root build: that one applies loom and architectury to everything it
// contains, and this module must never see a Minecraft classpath. Not a subproject of the gradle
// plugin either, because the plugin is itself an included build of the root — depending on a
// sibling of its own includer would be circular.
//
// Standing alone, it is includeBuild'd by both consumers (the gradle plugin and the root build, whose
// CLI module uses it) and published to mavenLocal for anyone resolving it as a coordinate.
rootProject.name = 'stagewright-engine'

// The agent a supervised game is started with. Part of this build so the engine's tests can start a
// real JVM with it, and so one includeBuild gives every consumer both coordinates.
include 'stagewright-agent'
project(':stagewright-agent').projectDir = file('../agent')
