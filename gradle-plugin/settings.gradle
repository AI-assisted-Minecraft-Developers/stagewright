// Standalone INCLUDED build for the stagewright gradle plugin.
//
// This build is wired into the root project via
//   pluginManagement { includeBuild('gradle-plugin') }
// in the repository-root settings.gradle. Being an *included build* it lives
// entirely OUTSIDE the root build's `subprojects {}` / Loom / ModDevGradle
// pipeline: it has its own settings, its own repositories, and its own
// (plain java-gradle-plugin) toolchain. It carries no Minecraft classpath.
pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

// The engine, shared with the CLI and the test engine. includeBuild for local development; consumers resolve the same
// coordinate from a repository.
includeBuild('../engine')

rootProject.name = 'stagewright-gradle-plugin'
