// stagewright gradle plugin — standalone included build.
//
// Publishes plugin id `net.magicterra.stagewright`. Applied to a mod project, it turns each declared
// topology into a `stagewright<Name>` task that provisions a clean run directory, runs that
// topology's own dev-run task, and judges the results file against the orchestration contract.
//
// No Python, and no process boundary: the run is an ordinary task dependency, so Gradle supervises a
// process it already knew how to supervise. The JSONL parser and the verdict rules live in the
// engine, shared with the CLI, and neither module has an external dependency, because a build plugin
// that drags a JSON library onto a consumer's buildscript classpath is a version conflict waiting to
// happen. See src/main/java/.../StageWrightPlugin.java.
plugins {
    id 'java-gradle-plugin'
    // java-gradle-plugin only CREATES the plugin-marker publication once maven-publish is
    // present; without this the plugin was reachable exclusively through includeBuild, i.e.
    // only from inside this repo. An external consumer resolves it from the Nexus, as
    // docs/reference/publishing.md shows:
    //   plugins { id 'net.magicterra.stagewright' version '0.1.0-build.<n>+1.21.1' }
    id 'maven-publish'
}

apply from: '../gradle/version.gradle'

group = 'net.magicterra'
version = stagewrightVersion

apply from: '../gradle/license.gradle'
apply from: '../gradle/nexus.gradle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Standard java-gradle-plugin functional-test layout: a dedicated `functionalTest`
// source set exercised through Gradle TestKit, separate from plain unit `test`.
def functionalTestSourceSet = sourceSets.create('functionalTest')

configurations.named('functionalTestImplementation') {
    extendsFrom(configurations.named('testImplementation').get())
}
configurations.named('functionalTestRuntimeOnly') {
    extendsFrom(configurations.named('testRuntimeOnly').get())
}

configurations {
    // The supervision agent, carried as a resource: a game loads it from a file, with -javaagent.
    bundledAgent { transitive = false }
}

dependencies {
    bundledAgent "net.magicterra:stagewright-agent:${stagewrightVersion}"

    // The one dependency, and it is ours. The no-external-dependencies rule above is about
    // third-party libraries colliding on a consumer's buildscript classpath; this artifact exists
    // so the CLI and this plugin judge a results file by the same code, and it pulls in nothing
    // itself for exactly that reason.
    api "net.magicterra:stagewright-engine:${stagewrightVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    // Gradle 8.x no longer bundles the platform launcher on the test runtime.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Gradle TestKit — spins up a synthetic consumer project in-process.
    functionalTestImplementation gradleTestKit()
}

// Staged as /agent/stagewright-agent.jar, version stripped so the lookup does not depend on it.
def stageBundledAgent = tasks.register('stageBundledAgent', Copy) {
    from configurations.bundledAgent
    into layout.buildDirectory.dir('bundled-agent')
    rename(/^stagewright-agent-.*\.jar$/, 'stagewright-agent.jar')
}
tasks.named('processResources') { into('agent') { from stageBundledAgent } }

// The plugin's own version, for the test-engine dependency it adds to a consumer, and the JUnit its dev runs get.
def versionResource = tasks.register('generateVersionResource') {
    def out = layout.buildDirectory.file('generated-resources/stagewright-plugin.properties')
    def v = stagewrightVersion
    def junit = junitVersion
    def worlddriver = worlddriverVersion
    def worlddriverRange = worlddriverVersionRange
    outputs.file(out)
    inputs.property('version', v)
    inputs.property('junit', junit)
    inputs.property('worlddriver', worlddriver)
    inputs.property('worlddriverRange', worlddriverRange)
    doLast {
        out.get().asFile.with {
            parentFile.mkdirs()
            text = "version=${v}\njunit=${junit}\nworlddriver=${worlddriver}\nworlddriverRange=${worlddriverRange}\n"
        }
    }
}
tasks.named('processResources') { from(versionResource) }

def functionalTest = tasks.register('functionalTest', Test) {
    description = 'Runs the Gradle TestKit functional tests.'
    group = 'verification'
    testClassesDirs = functionalTestSourceSet.output.classesDirs
    classpath = functionalTestSourceSet.runtimeClasspath
    useJUnitPlatform()
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn(functionalTest)
}

gradlePlugin {
    // Inject the plugin-under-test metadata onto the functionalTest classpath so
    // GradleRunner.withPluginClasspath() can resolve `id 'net.magicterra.stagewright'`.
    testSourceSets(functionalTestSourceSet)
    plugins {
        create('mcStageWright') {
            id = 'net.magicterra.stagewright'
            implementationClass = 'net.magicterra.stagewright.gradle.StageWrightPlugin'
        }
    }
}
