// stagewright gradle plugin — standalone included build.
//
// Publishes plugin id `net.magicterra.stagewright`. Applied to a mod project, it gives each declared
// test suite a `stagewrightTest<Name>` Test task on the StageWright test engine, with launch specs
// read off the host's dev runs. No external dependency besides our own engine: a JSON library on a
// consumer's buildscript classpath is a version conflict waiting to happen.
// See src/main/java/.../StageWrightPlugin.java.
plugins {
    id 'java-gradle-plugin'
    // java-gradle-plugin only CREATES the plugin-marker publication once maven-publish is
    // present; without this the plugin was reachable exclusively through includeBuild, i.e.
    // only from inside this repo. An external consumer resolves it from the Nexus, as
    // docs/reference/publishing.md shows:
    //   plugins { id 'net.magicterra.stagewright' version '0.1.0-alpha.<n>+1.21.1' }
    id 'maven-publish'
    id 'stagewright.version'
    id 'stagewright.license'
    id 'stagewright.nexus'
    id 'stagewright.lint'
}

group = 'net.magicterra'
version = stagewrightVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Standard java-gradle-plugin functional-test layout: a dedicated `functionalTest`
// source set exercised through Gradle TestKit, separate from plain unit `test`.
def functionalTestSourceSet = sourceSets.create('functionalTest')

configurations.named('functionalTestImplementation') {
    extendsFrom(configurations.named('testImplementation').get())
}
configurations.named('functionalTestRuntimeOnly') {
    extendsFrom(configurations.named('testRuntimeOnly').get())
}

dependencies {
    // The one dependency, and it is ours: it pulls in nothing itself (the launch-spec JSON writer).
    api "net.magicterra:stagewright-engine:${stagewrightVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    // Gradle 8.x no longer bundles the platform launcher on the test runtime.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Gradle TestKit — spins up a synthetic consumer project in-process.
    functionalTestImplementation gradleTestKit()
}

// The plugin's own version, for the test-engine dependency it adds to a consumer, and the JUnit its dev runs get.
def versionResource = tasks.register('generateVersionResource') {
    def out = layout.buildDirectory.file('generated-resources/stagewright-plugin.properties')
    def v = stagewrightVersion
    def junit = junitVersion
    def worlddriver = worlddriverDependency
    def worlddriverRange = worlddriverVersionRange
    outputs.file(out)
    inputs.property('version', v)
    inputs.property('junit', junit)
    inputs.property('worlddriver', worlddriver)
    inputs.property('worlddriverRange', worlddriverRange)
    doLast {
        out.get().asFile.with {
            parentFile.mkdirs()
            text = "version=${v}\njunit=${junit}\nworlddriver=${worlddriver}\nworlddriverRange=${worlddriverRange}\n"
        }
    }
}
tasks.named('processResources') { from(versionResource) }

// The test engine from the included engine build, for the functional test that runs a suite end to end.
def realTestEngine = configurations.create('functionalTestEngine') {
    canBeConsumed = false
}
dependencies {
    functionalTestEngine "net.magicterra:stagewright-testengine:${stagewrightVersion}"
    functionalTestEngine platform('org.junit:junit-bom:5.11.3')
    functionalTestEngine 'org.junit.platform:junit-platform-launcher'
}

def functionalTest = tasks.register('functionalTest', Test) {
    description = 'Runs the Gradle TestKit functional tests.'
    group = 'verification'
    testClassesDirs = functionalTestSourceSet.output.classesDirs
    classpath = functionalTestSourceSet.runtimeClasspath
    useJUnitPlatform()
    def engineFiles = realTestEngine
    inputs.files(engineFiles).withNormalizer(ClasspathNormalizer)
    jvmArgumentProviders.add({
        [
            "-Dstagewright.functionalTest.engine=${engineFiles.asPath}".toString()
        ]
    } as CommandLineArgumentProvider)
    // Optional: a Gradle installation to run the end-to-end suite test under as well, such as a newer one.
    def otherGradle = providers.gradleProperty('functionalTestGradleHome')
    if (otherGradle.isPresent()) systemProperty 'stagewright.functionalTest.gradleHome', otherGradle.get()
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn(functionalTest)
}

gradlePlugin {
    // Inject the plugin-under-test metadata onto the functionalTest classpath so
    // GradleRunner.withPluginClasspath() can resolve `id 'net.magicterra.stagewright'`.
    testSourceSets(functionalTestSourceSet)
    plugins {
        create('mcStageWright') {
            id = 'net.magicterra.stagewright'
            implementationClass = 'net.magicterra.stagewright.gradle.StageWrightPlugin'
        }
    }
}
