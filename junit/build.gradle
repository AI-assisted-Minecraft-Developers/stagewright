// stagewright/junit — pure-JVM JUnit 5 attach module (project name: stagewright-junit).
//
// This module is deliberately NOT a Minecraft/loader module: it carries no
// architectury/loom plugins, no Minecraft classpath, no worlddriver classes.
// It is the OUT-OF-PROCESS consumer of a live testkit endpoint (TESTKIT_ENDPOINT,
// written by scripts/stagewright/t1.py --hold), talking to the driver purely over the
// bare-RPC websocket. The root build's `subprojects {}` block applies loom to every
// subproject unconditionally; this module is scoped OUT of that block by name in the
// root build.gradle (`if (project.name == 'stagewright-junit') return`). group/version
// still flow from the root `allprojects {}` block.
plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

repositories {
    // Non-loom module: loom is not here to auto-inject the essential repos, so we
    // declare mavenCentral ourselves (the root subprojects.repositories block is
    // empty and settings.gradle has no dependencyResolutionManagement).
    mavenCentral()
}

dependencies {
    // gson is part of the PUBLIC surface (JsonObject appears in StageWrightRpc.call and
    // the StageWright facade return types), so it is `api`, not `implementation`.
    api 'com.google.code.gson:gson:2.11.0'

    // StageWrightExtension implements JUnit 5 BeforeAllCallback + ParameterResolver in the
    // MAIN source set, and third-party tests @ExtendWith(StageWrightExtension.class) against
    // it, so junit-jupiter-api must be a MAIN (api) dependency — not test-only. The
    // engine + full aggregator stay on the test face.
    api platform('org.junit:junit-bom:5.11.3')
    api 'org.junit.jupiter:junit-jupiter-api'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

test {
    useJUnitPlatform()
    // Pass the ambient TESTKIT_ENDPOINT straight through (empty when unset) so the
    // self-tests run live-free and attach()'s fail-fast is exercised honestly.
    environment 'TESTKIT_ENDPOINT', System.getenv('TESTKIT_ENDPOINT') ?: ''
}

// Maven publishing — DELIBERATELY THE OPPOSITE of the mod-jar POM rule in the
// root build.gradle's subprojects{} block. Mod jars (worlddriver-*,
// mc_stagewright-common/fabric/neoforge) nest their runtime deps via Jar-in-Jar and
// therefore strip <dependency> entries from the published POM (a naive consumer
// resolving the raw POM would double up e.g. Rhino — docs/feedback/2026-06-04,
// bug #2). This module is a THIN PLAIN-JVM LIBRARY: it does not shade or nest
// anything, so a consumer's build tool is the one that must resolve gson and
// junit-jupiter-api transitively. The POM MUST declare them, or `mc_stagewright-junit`
// silently fails to compile for any consumer that doesn't happen to already have
// those two on their classpath. `from components.java` (java-library plugin)
// already publishes `api` dependencies as real <dependency> entries — no
// pom.withXml stripping here, unlike the mod-jar publications.
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'mc_stagewright-junit'
            from components.java
        }
    }

    repositories {
        mavenLocal()
    }
}

// Module metadata (.module) is left ENABLED here (unlike the mod-jar
// publications, which disable GenerateModuleMetadata because their variant
// graph still carries the nested-but-POM-stripped deps and would contradict
// the cleaned POM). This module has no such split: the `java` component's
// variants and the POM both derive from the same `api`/`implementation`
// dependency declarations above, so the .module file and the POM agree —
// nothing to reconcile, and Gradle consumers get richer variant-aware
// resolution for free.
