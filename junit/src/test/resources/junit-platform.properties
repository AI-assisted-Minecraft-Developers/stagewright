# Order test CLASSES by @Order, defaulting the unannotated ones to the middle of the range.
#
# One test needs this: instrument.ArmedSuiteContractTest triggers a real scene suite to prove the
# on-demand trigger refuses a second call, and a running suite summons mobs, sets time and can bring
# a player into a world every other test assumes is empty. It carries @Order(Integer.MAX_VALUE) so
# it lands after everything else. Without this property that annotation is silently ignored and the
# ordering is whatever the platform's default happens to be — which is deterministic but arbitrary,
# and put the destructive test first often enough to matter.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
