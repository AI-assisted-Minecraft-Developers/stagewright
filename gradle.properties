# StageWright — build properties, read by the root build. The engine, cli and gradle-plugin builds
# are separate and read from it only what the stagewright.version plugin (build-logic) needs.

# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# The version is <this>-alpha.<n>+<minecraft_version>; see build-logic/src/main/groovy/stagewright.version.gradle.
mod_base_version = 0.1.0
maven_group = net.magicterra
archives_name = mc_stagewright

mod_id = mc_testkit
mod_name = StageWright
mod_license = LGPL-3.0-only
mod_authors = AI-assisted-Minecraft-Developers
mod_description = Cross-loader scene test framework for Minecraft mods: origin-relative arenas, tick-budgeted awaits, and a JSONL results contract judged by an external orchestrator.

# Minecraft platform versions — MUST stay in lockstep with worlddriver's gradle.properties.
# StageWright compiles against worlddriver-common's `dev` artifact, which is built against
# these exact versions; a drift here surfaces as link errors on Minecraft signatures, not as
# a helpful version conflict.
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
loader_version_range = [4,)

fabric_loader_version = 0.16.14
fabric_loader_version_range = [0.16,)
fabric_api_version = 0.116.4+1.21.1
neoforge_version = 21.1.230
neoforge_version_range = [21,)
# The vanilla api and common compile against: the NeoForm NeoForge $neoforge_version is built on.
neoform_version = 1.21.1-20240808.144430
# The Mixin common's mixin compiles against; at run time each loader brings its own.
mixin_version = 0.8.5

# The WorldDriver build StageWright compiles against. Consumed as
# `net.magicterra:worlddriver-common:<this>:dev` — the `dev` classifier being the
# named-mappings artifact (see worlddriver's root build.gradle for why the plain one
# cannot be compiled against). A build worlddriver's CI published to the Nexus; moving to a newer
# one is a commit here. Override with -Pworlddriver_version=0.1.0-snapshot+1.21.1 to build
# against a worlddriver published to mavenLocal.
worlddriver_version = 0.1.0-alpha.26+1.21.1

# Rhino is COMPILE-ONLY in the mod: the copy a game runs is the one worlddriver nests. The test
# engine relocates this same version into its own jar, to read script tests outside the game.
#
# Still no netty_version: that one really is worlddriver's alone.
rhino_version = 2101.2.7-build.81
# Reads YAML tests: relocated into the loader jars for the game, and into the test engine's for discovery.
snakeyaml_version = 2.3

# The JUnit (Jupiter) version the in-game runner is built with and nests, and the one the Gradle plugin adds to a
# consumer's dev runs; read by all builds through the stagewright.version plugin.
junit_version = 5.11.3
