// The -javaagent a supervised game starts with: JDK only, no class transformation (docs/design/supervision.md).
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'stagewright.module'
}

// For the lint tools only; the agent itself has no dependencies.
repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.named('jar', Jar) {
    archiveBaseName = 'stagewright-agent'
    manifest {
        attributes 'Premain-Class': 'net.magicterra.stagewright.agent.Agent',
        'Can-Redefine-Classes': 'false',
        'Can-Retransform-Classes': 'false'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'stagewright-agent'
        }
    }
    repositories {
        mavenLocal()
    }
}
