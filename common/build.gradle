neoForge {
    // Vanilla in Mojang names, the one NeoForge $neoforge_version is built on.
    neoFormVersion = rootProject.neoform_version
    addModdingDependenciesTo(sourceSets.test)
}

base {
    archivesName = 'mc_stagewright-common'
}

// This jar is the Mojang-named one, published as `dev`; the plain artifact is :stagewright-fabric's remap of it.
tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
ext.devJar = tasks.named('jar')

dependencies {
    // The mixin annotations; each loader brings its own Mixin at run time.
    compileOnly "org.spongepowered:mixin:$rootProject.mixin_version"

    // The published API (the test API and the capability layer). Split out so the artifact graph
    // between this repo and worlddriver stays acyclic — see api/build.gradle.
    implementation project(':stagewright-api')

    // StageWright depends on the driver it drives, so the mc.test.* methods register into its
    // API registry directly. The `dev` classifier, not the plain jar: the published jar
    // is remapped to intermediary and will not link against a dev-mapped compile classpath.
    implementation "net.magicterra:worlddriver-common:${rootProject.worlddriver_version}:dev"
    // Its api is a module of its own; the `dev` jars declare no dependencies, so name it too.
    implementation "net.magicterra:worlddriver-api:${rootProject.worlddriver_version}:dev"

    // The JUnit Platform the game runs tests on (jupiter/JupiterRun); the loader jars must ship it.
    implementation platform("org.junit:junit-bom:${rootProject.junit_version}")
    implementation 'org.junit.platform:junit-platform-launcher'
    implementation 'org.junit.platform:junit-platform-reporting'
    implementation 'org.junit.jupiter:junit-jupiter-engine'

    // YAML tests; the loader jars carry it relocated.
    compileOnly "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    testImplementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"

    // WorldDriver provides the required runtime copy; do not embed Rhino a second time.
    compileOnly "dev.latvian.mods:rhino:${rootProject.rhino_version}"

    testImplementation "dev.latvian.mods:rhino:${rootProject.rhino_version}"
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
