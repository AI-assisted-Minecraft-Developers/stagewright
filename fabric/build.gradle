plugins {
    id 'com.gradleup.shadow'
}

base {
    archivesName = 'mc_stagewright-fabric'
}

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // api's and common's jars, in Mojang names, go into this mod's jar whole and are remapped with it. Transitive on
    // the classpath, so the remap sees the WorldDriver classes theirs extend.
    implementation project(':stagewright-api')
    implementation project(':stagewright-common')
    shadowBundle(project(':stagewright-api')) { transitive = false }
    shadowBundle(project(':stagewright-common')) { transitive = false }
    shadowBundle "org.yaml:snakeyaml:$rootProject.snakeyaml_version"

    // The JUnit Platform the in-game test runner uses, nested (Jar-in-Jar) as libraries.
    rootProject.junitPlatformJars.each { include it }

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The pin the metadata was rendered from, which -Pworlddriver_version may override.
    systemProperty 'stagewright.worlddriverDependency', rootProject.worlddriver_version
}

// fabric.mod.json cannot read Maven ranges, and gradle.properties states each range once, in the
// Maven form neoforge.mods.toml takes verbatim. '[1.21.1,1.22)' becomes '>=1.21.1 <1.22'.
def mavenBounds = { String range ->
    def m = range.trim() =~ /^([\[(])([^,]*),([^\])]*)([\])])$/
    if (!m.matches()) throw new GradleException("not a Maven version range: '$range'")
    [min: m.group(2).trim(), minInclusive: m.group(1) == '[', max: m.group(3).trim(), maxInclusive: m.group(4) == ']']
}
def fabricPredicate = { String range ->
    def b = mavenBounds(range)
    def terms = []
    if (b.min) terms << (b.minInclusive ? '>=' : '>') + b.min
    if (b.max) terms << (b.maxInclusive ? '<=' : '<') + b.max
    terms ? terms.join(' ') : '*'
}
processResources {
    def metadata = [
            version                    : project.version,
            mod_id                     : rootProject.mod_id,
            mod_name                   : rootProject.mod_name,
            mod_license                : rootProject.mod_license,
            mod_authors                : rootProject.mod_authors,
            mod_description            : rootProject.mod_description,
            minecraft_version_range    : fabricPredicate(rootProject.minecraft_version_range),
            fabric_loader_version_range: fabricPredicate(rootProject.fabric_loader_version_range),
            worlddriver_version_range  : fabricPredicate(rootProject.worlddriverVersionRange),
    ]
    inputs.properties metadata

    filesMatching('fabric.mod.json') {
        expand metadata
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Load-bearing. Capability providers arrive through META-INF/services, and that path now exists
    // in BOTH :stagewright-api (the shipped Curios/FTB Quests adapters) and this module. Shadow's
    // default is last-writer-wins per path, so without this the jar ships one file and every
    // provider in the other reports itself absent — which is indistinguishable from an uninstalled
    // mod, and would be found by a scene skipping for a reason that is not true.
    // Shadow 9 hands a transformer only the duplicates the strategy lets through.
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    mergeServiceFiles()
    // Another mod may ship its own snakeyaml.
    relocate 'org.yaml.snakeyaml', 'net.magicterra.stagewright.shadow.snakeyaml'
    into('META-INF/licenses') { from rootProject.file('cli/src/main/resources/META-INF/licenses/Apache-2.0.txt') }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// The published artifacts: the remapped jar ships, Loom's named jar of this module's own classes is `dev`.
ext.shippedJar = tasks.named('remapJar')
ext.devJar = tasks.named('jar')
ext.devShadowJar = tasks.named('shadowJar')
ext.sourcesJarTask = tasks.named('remapSourcesJar')

// api's and common's plain artifacts: their Mojang-named jars remapped to intermediary. Registered here because
// this is the project with Loom's mappings.
[':stagewright-api', ':stagewright-common'].each { path ->
    evaluationDependsOn(path)
    def module = project(path)
    def remap = tasks.register("remap${path.split('-')[1].capitalize()}Jar", net.fabricmc.loom.task.RemapJarTask) {
        inputFile = module.tasks.named('jar', Jar).flatMap { it.archiveFile }
        archiveBaseName = module.base.archivesName
        archiveClassifier = ''
        destinationDirectory = module.layout.buildDirectory.dir('libs')
        addNestedDependencies = false
    }.get() // Created here: realized lazily from the other project's publication, it races this one's tasks.
    module.tasks.named('assemble') { dependsOn remap }
    module.publishing.publications.named('mavenJava') { artifact(remap) }
}
