plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = 'mc_stagewright-fabric'
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // A PLAIN project dependency, not the `namedElements` / `transformProduction*` pair the other
    // two use: those are loom configurations, and :stagewright-attached is deliberately not a loom
    // module (no Minecraft to remap, so nothing to name or transform). Asking a non-loom project for
    // a loom configuration fails at configuration time.
    //
    // It must still be BUNDLED. Its classes are on the api's public surface, so a mod jar shipping
    // without them boots and then dies the first time a scene calls expect().
    compileOnly project(':stagewright-attached')
    shadowBundle project(':stagewright-attached')

    common(project(path: ':stagewright-api', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':stagewright-api', configuration: 'transformProductionFabric')

    common(project(path: ':stagewright-common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':stagewright-common', configuration: 'transformProductionFabric')

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// fabric.mod.json cannot read Maven ranges, and gradle.properties states each range once, in the
// Maven form neoforge.mods.toml takes verbatim. '[1.21.1,1.22)' becomes '>=1.21.1 <1.22'.
def mavenBounds = { String range ->
    def m = range.trim() =~ /^([\[(])([^,]*),([^\])]*)([\])])$/
    if (!m.matches()) throw new GradleException("not a Maven version range: '$range'")
    [min: m.group(2).trim(), minInclusive: m.group(1) == '[', max: m.group(3).trim(), maxInclusive: m.group(4) == ']']
}
def fabricPredicate = { String range ->
    def b = mavenBounds(range)
    def terms = []
    if (b.min) terms << (b.minInclusive ? '>=' : '>') + b.min
    if (b.max) terms << (b.maxInclusive ? '<=' : '<') + b.max
    terms ? terms.join(' ') : '*'
}
// Everything outside the range, as the JSON array `breaks` takes (any element matching refuses).
// Fabric Loader ignores a `suggests` version entirely, so `breaks` is what enforces the range.
def fabricComplement = { String range ->
    def b = mavenBounds(range)
    def terms = []
    if (b.min) terms << (b.minInclusive ? '<' : '<=') + b.min
    if (b.max) terms << (b.maxInclusive ? '>' : '>=') + b.max
    '[' + terms.collect { "\"$it\"" }.join(', ') + ']'
}

processResources {
    def metadata = [
            version                    : project.version,
            mod_id                     : rootProject.mod_id,
            mod_name                   : rootProject.mod_name,
            mod_license                : rootProject.mod_license,
            mod_authors                : rootProject.mod_authors,
            mod_description            : rootProject.mod_description,
            minecraft_version_range    : fabricPredicate(rootProject.minecraft_version_range),
            fabric_loader_version_range: fabricPredicate(rootProject.fabric_loader_version_range),
            worlddriver_version_range  : fabricPredicate(rootProject.worlddriverVersionRange),
            worlddriver_breaks         : fabricComplement(rootProject.worlddriverVersionRange),
    ]
    inputs.properties metadata

    filesMatching('fabric.mod.json') {
        expand metadata
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    // Load-bearing. Capability providers arrive through META-INF/services, and that path now exists
    // in BOTH :stagewright-api (the shipped Curios/FTB Quests adapters) and this module. Shadow's
    // default is last-writer-wins per path, so without this the jar ships one file and every
    // provider in the other reports itself absent — which is indistinguishable from an uninstalled
    // mod, and would be found by a scene skipping for a reason that is not true.
    mergeServiceFiles()
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    runs {
        // T0 headless shell: a PLAIN dedicated server (no GameTestServer — its
        // scheduler is the disease the spec §3.1 removes by existence). The
        // testkit harness arms on -Dstagewright.autorun and halts the server when done.
        stagewrightServer {
            server()
            property 'stagewright.autorun', 'true'
            runDir 'run-stagewright'
        }
    }
    runConfigs.configureEach {
        vmArg '-Xmx1g'
    }
}
