// The test API and the capability layer. Depends only on WorldDriver's :api (docs/reference/publishing.md).
plugins {
    // java-library for the `api` configuration, which ModDevGradle does not add.
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'stagewright.mod'
}

neoForge {
    // Vanilla in Mojang names, the one NeoForge $neoforge_version is built on.
    neoFormVersion = rootProject.neoform_version
    addModdingDependenciesTo(sourceSets.test)
}

base {
    archivesName = 'mc_stagewright-api'
}

// This jar is the Mojang-named one, published as `dev`; the plain artifact is :stagewright-fabric's remap of it.
tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
ext.devJar = tasks.named('jar')

dependencies {
    // A capability that cannot work in this run aborts the test (TestAbortedException); the runtime bundles it.
    compileOnly "org.opentest4j:opentest4j:1.3.0"

    // The JUnit-native test API (net.magicterra.stagewright.test) hands out WorldDriver's registry and callers.
    // WorldDriver's :api depends on nothing of ours, so it is published first and the graph stays acyclic.
    api "net.magicterra:worlddriver-api:${rootProject.worlddriver_version}:dev"
    // Generates the callers of StageWright's own mc.test.* families, as it does WorldDriver's (docs/design/test-queries.md).
    annotationProcessor "net.magicterra:worlddriver-api-processor:${rootProject.worlddriver_version}"

    // Plain JUnit, no game: only the logic that never touches a live level is tested here.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The one dependency the published POM keeps: Game.registry() and the callers name WorldDriver's api types, so a
// consumer cannot compile against this jar without it. Minecraft and Gson come with the consumer's own loader
// setup, opentest4j with its JUnit.
ext.pomKeeps = [
    'net.magicterra:worlddriver-api'
]

tasks.named('test', Test) {
    useJUnitPlatform()
}
