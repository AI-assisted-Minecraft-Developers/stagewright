// A single executable jar a modpack author can run with the JVM they already have.
plugins {
    id 'application'
    id 'maven-publish'
}

group = 'net.magicterra'
version = '0.1.0'

apply from: '../gradle/license.gradle'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()          // the loader jars staged below are published here by the root build
    mavenCentral()
    maven {
        // Rhino, for out-of-process scenes. Not on Maven Central, and FENCED to its own group.
        // The fence is not tidiness: conformance-mods hit a repository whose domain had expired and
        // whose parking page answered 200 to every path — Gradle takes the first repository that
        // answers, so it black-holed the nine healthy ones declared after it and reported the damage
        // as nine unparseable POMs.
        url "https://maven.latvian.dev/releases"
        content { includeGroup 'dev.latvian.mods' }
    }
}

// The Minecraft-side jars this CLI installs into a pack, carried as resources rather than
// downloaded. A pack author gets one file; making them also fetch a matching loader build for a
// matching Minecraft version is the step that fails, and it fails looking exactly like the mod not
// working. `frameworkVersion` must track the root build's — publishing the mods and rebuilding this
// are one release, not two (see RELEASE ORDER in ../build.gradle).
def frameworkVersion = '0.1.0+1.21.1'
configurations { bundledMods { transitive = false } }
dependencies {
    // A PUBLISHED artifact, and engine/ is its own standalone build — so the root
    // `./gradlew publishToMavenLocal` does NOT rebuild it, and neither does building this jar.
    // Change anything under engine/ and the release is three steps, in order:
    //
    //     cd engine && ../gradlew publishToMavenLocal
    //     cd ../     && ./gradlew publishToMavenLocal      # the Minecraft-side jars
    //     cd cli     && ../gradlew jar
    //
    // Skip the first and this jar keeps shipping the engine it was built against, silently. It cost
    // a full ATM10 run: the provisioning step had learned to install capability descriptors, the
    // rebuilt CLI still had the version that did not, and the pack ran perfectly while the scenes
    // depending on those descriptors failed as though the pack were missing them.
    implementation 'net.magicterra:stagewright-engine:0.1.0'
    bundledMods "net.magicterra:mc_stagewright-neoforge:${frameworkVersion}"
    bundledMods "net.magicterra:mc_stagewright-fabric:${frameworkVersion}"

    // Out-of-process scenes. The SAME artifact and the SAME version the bundled mod jars shadow —
    // which is the whole guarantee that one `.js` file behaves identically in both homes, and the
    // reason `frameworkVersion` is used here rather than a second literal. A skew between this and
    // the mods staged above would not fail loudly; it would make a scene mean two things.
    implementation "net.magicterra:mc_stagewright-attached:${frameworkVersion}"

    // Rhino and gson are compileOnly in that module, on purpose: inside the game both are already
    // present (worlddriver embeds Rhino, Minecraft ships gson), and bundling either into a mod jar
    // would put a second copy on the game's classpath. Out here nothing provides them, so this is
    // where they become real. Same Rhino coordinate as the mod side — the KubeJS fork, not Mozilla's:
    // two homes on two interpreters would not be running the same language.
    implementation "dev.latvian.mods:rhino:2101.2.7-build.81"
    implementation 'com.google.code.gson:gson:2.11.0'

    // The parts of this CLI that can be tested without a modpack: which loader version a pack
    // directory says it boots, and whether the name a run is judged on reaches the game. Both were
    // wrong in a way no compiler catches and only a real pack revealed.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Staged under /mods/mc_stagewright-<loader>.jar — version stripped on purpose, so the extraction
// code never has to know which version it carries and an upgrade is a rebuild rather than an edit.
def stageBundledMods = tasks.register('stageBundledMods', Copy) {
    from configurations.bundledMods
    into layout.buildDirectory.dir('bundled-mods')
    rename(/^(mc_stagewright-(?:neoforge|fabric))-.*\.jar$/, '$1.jar')
}
tasks.named('processResources') { into('mods') { from stageBundledMods } }

application {
    mainClass = 'net.magicterra.stagewright.cli.Main'
}

// Fat jar, deliberately: the audience is someone who downloads one file and runs it. A CLI that
// needed a -cp with the engine beside it would be a worse experience than the Gradle plugin it
// exists to replace for them.
//
// Merging a library's classes conveys that library, so each one needs its entry in
// src/main/resources/META-INF/THIRD-PARTY-NOTICES and its license text beside it; the merged jars
// carry none of their own. scripts/check_packaging.py fails a jar holding classes it cannot place.
tasks.named('jar', Jar) {
    archiveBaseName = 'stagewright'
    archiveClassifier = ''
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'net.magicterra.stagewright.cli.Main'
    }
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        // Rhino is itself a mod jar. Its loader metadata at this jar's root would make a copy
        // dropped into mods/ by mistake load as a second `rhino` mod on either loader.
        exclude 'fabric.mod.json', 'quilt.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml',
                'pack.mcmeta', 'rhino_logo.png'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
