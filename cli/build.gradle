// A single executable jar a modpack author can run with the JVM they already have.
plugins {
    id 'application'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// The Minecraft-side jars this CLI installs into a pack, carried as resources rather than
// downloaded. A pack author gets one file; making them also fetch a matching loader build for a
// matching Minecraft version is the step that fails, and it fails looking exactly like the mod not
// working. Publishing the mods and rebuilding this are one release, not two, which
// the stagewright.version plugin holds to one version.
configurations {
    bundledMods { transitive = false }
}
dependencies {
    // Built from engine/ through the includeBuild in settings.gradle, so this jar always carries
    // the engine in the tree.
    implementation "net.magicterra:stagewright-engine:${stagewrightVersion}"
    // `stagewright test`: the JUnit engine a test task runs, launched here instead.
    implementation "net.magicterra:stagewright-testengine:${stagewrightVersion}"
    implementation platform('org.junit:junit-bom:5.11.3')
    implementation 'org.junit.platform:junit-platform-launcher'
    implementation 'org.junit.platform:junit-platform-reporting'

    // The two loader jars, as the sibling projects build them (the shadow-bundled jar a loader loads,
    // remapped on Fabric), so building this builds them and a skew between the mods and this jar cannot
    // exist. NeoForge's mod jar is its shadowJar; its runtimeElements carries the module's own classes.
    bundledMods project(path: ':stagewright-neoforge', configuration: 'shadowRuntimeElements')
    bundledMods project(path: ':stagewright-fabric', configuration: 'runtimeElements')

    // The client installer and the launch specs. The supervision agent and Rhino arrive inside the
    // test engine's jar.
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Staged under /mods/mc_stagewright-<loader>.jar — version stripped on purpose, so the extraction
// code never has to know which version it carries and an upgrade is a rebuild rather than an edit.
def stageBundledMods = tasks.register('stageBundledMods', Copy) {
    from configurations.bundledMods
    into layout.buildDirectory.dir('bundled-mods')
    rename(/^(mc_stagewright-(?:neoforge|fabric))-.*\.jar$/, '$1.jar')
}
tasks.named('processResources') { into('mods') { from stageBundledMods } }

// What this jar was built from, printed by `--version`.
def buildInfo = tasks.register('buildInfo') {
    def out = layout.buildDirectory.file('generated/build-info/stagewright-cli-build.properties')
    def parts = configurations.runtimeClasspath.incoming.files + configurations.bundledMods
    // No build time here: CI publishes the jar it tested because each later Gradle run in the job
    // finds this file up to date. A part's time is its file's, which the job writes only once.
    def version = stagewrightVersion
    inputs.files(parts)
    inputs.property('version', version)
    outputs.file(out)
    doLast {
        def lines = ["version=${version}"]
        parts.files.findAll { it.name.startsWith('stagewright-') || it.name.startsWith('mc_stagewright-') }
                .sort { it.name }.each { f ->
            def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(f.bytes).encodeHex().toString()
            lines << "${f.name}=${java.time.Instant.ofEpochMilli(f.lastModified())} ${sha1.take(8)}"
        }
        out.get().asFile.text = lines.join('\n') + '\n'
    }
}
tasks.named('processResources') { from buildInfo }

application {
    mainClass = 'net.magicterra.stagewright.cli.Main'
}

// Fat jar, deliberately: the audience is someone who downloads one file and runs it. A CLI that
// needed a -cp with the engine beside it would be a worse experience than the Gradle plugin it
// exists to replace for them.
//
// Merging a library's classes conveys that library, so each one needs its entry in
// src/main/resources/META-INF/THIRD-PARTY-NOTICES and its license text beside it; the merged jars
// carry none of their own. scripts/check_packaging.py fails a jar holding classes it cannot place.
tasks.named('jar', Jar) {
    archiveBaseName = 'stagewright'
    archiveClassifier = ''
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'net.magicterra.stagewright.cli.Main'
    }
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        // Rhino is itself a mod jar. Its loader metadata at this jar's root would make a copy
        // dropped into mods/ by mistake load as a second `rhino` mod on either loader.
        exclude 'fabric.mod.json', 'quilt.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml',
                'pack.mcmeta', 'rhino_logo.png'
        // A library's module descriptor describes that library alone, not this merged jar.
        exclude 'module-info.class', 'META-INF/versions/*/module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// The fat jar alone, with no dependencies in its POM: everything it needs is inside it.
publishing {
    publications {
        cli(MavenPublication) {
            artifactId = 'stagewright-cli'
            artifact(tasks.named('jar'))
        }
    }
}
