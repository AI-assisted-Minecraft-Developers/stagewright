// StageWright — root build.
//
// A deliberately trimmed sibling of worlddriver's root build.gradle: this repo builds only the
// framework, and consumes the driver it drives as a published artifact.
//
// RELEASE ORDER. The two repos depend on each other, in opposite directions and at different
// points. Each pins a build of the other on the Nexus (worlddriver_version here), so neither needs
// the other's source; a clean start has one working bootstrap sequence, written out with its
// reasons in docs/reference/publishing.md.
//
// Differences from worlddriver's root, and why:
//   - no `id 'net.magicterra.stagewright'` applied here. That plugin is StageWright's own
//     product; applying it to its own build would be circular. worlddriver applies it as the
//     first dogfood consumer, which is the point.
//   - no rhino/netty wiring. Those are worlddriver's embedded runtime libraries.
//   - the `dev` classifier publication is kept VERBATIM, because the dependency runs both
//     ways: worlddriver's testmod compiles against mc_stagewright-api:dev.
plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = project.minecraft_version
}

// worlddriver stays optional, but one that is present must be a release StageWright links against:
// the line of worlddriver_version up to its next breaking release (the next minor while it is 0.x).
// Both loaders' metadata declare it, so the loader refuses the pair instead of the mc.test.* verbs
// failing to link at server start. Both bounds end in `-0`, the lowest pre-release of that version:
// every build is published as a pre-release (0.1.0-build.N), which SemVer — and so Fabric — orders
// below 0.1.0 itself.
ext.worlddriverVersionRange = {
    def m = worlddriver_version =~ /^(\d+)\.(\d+)\.(\d+)/
    if (!m.find()) throw new GradleException("worlddriver_version is not major.minor.patch: '$worlddriver_version'")
    int major = m.group(1) as int
    int minor = m.group(2) as int
    "[${m.group()}-0,${major == 0 ? "0.${minor + 1}.0" : "${major + 1}.0.0"}-0)".toString()
}()

apply from: 'gradle/version.gradle'

allprojects {
    group = rootProject.maven_group
    version = rootProject.stagewrightVersion
}

// One Architectury transform at a time: they pass their classpath through JVM-wide system
// properties. See docs/reference/publishing.md, "The Architectury transforms run one at a time".
def architecturyTransforms = gradle.sharedServices.registerIfAbsent('architecturyTransforms', BuildService) {
    maxParallelUsages = 1
}

subprojects {
    // Before the pure-JVM early return below: those two modules publish too.
    apply from: rootProject.file('gradle/license.gradle')
    def module = project
    plugins.withId('maven-publish') {
        module.apply from: rootProject.file('gradle/nexus.gradle')
    }

    // Two pure-JVM modules — no Minecraft, no loader, no loom — each providing its own
    // java-library setup. Scope them out of the loom/architectury/MC pipeline that every other
    // subproject shares. (group/version still come from allprojects.)
    //
    //   stagewright-junit     the JUnit 5 attach module (out-of-process RPC consumer)
    //   stagewright-attached  the vocabulary BOTH homes share — see attached/build.gradle. Applying
    //                         loom to it would put a Minecraft classpath under a module whose whole
    //                         contract is not having one, and the CLI (a separate build with no
    //                         Minecraft anywhere) could not consume the result.
    if (project.name == 'stagewright-junit' || project.name == 'stagewright-attached') return

    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    tasks.withType(dev.architectury.plugin.TransformingTask).configureEach {
        usesService(architecturyTransforms)
    }

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // stagewright-common compiles against net.magicterra:worlddriver-common:<v>:dev, which
        // worlddriver's CI publishes to the Nexus below. mavenLocal comes first, so a worlddriver
        // published locally for development is found without it.
        mavenLocal()
        maven {
            name = 'gardelNexus'
            url = 'https://nexus.gardel.top/repository/maven-releases'
            content { includeGroup 'net.magicterra' }
        }
        mavenCentral()
        // Rhino (KubeJS fork), compile-only, for the JavaScript scene loader. Not on Maven Central.
        // Fenced to its own group: Gradle takes the first repository that answers, and a third-party
        // host whose parking page answers 200 to any path would otherwise serve bogus POMs for every
        // artifact not found earlier.
        maven {
            name = 'latvian-releases'
            url = 'https://maven.latvian.dev/releases'
            content { includeGroup 'dev.latvian.mods' }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                // The NAMED-mappings jar — see worlddriver's root build.gradle for the full
                // reasoning. Short version: components.java publishes loom's REMAPPED artifact
                // (intermediary, net/minecraft/class_1291), which cannot be compiled against
                // from a dev environment. Loom already builds build/devlibs/<name>-dev.jar;
                // this stops it being discarded. worlddriver's testmod consumes
                // mc_stagewright-api:dev through exactly this.
                artifact(tasks.named('jar')) { classifier = 'dev' }

                // Strip <dependency> entries, because a mod jar NESTS its runtime deps via
                // Jar-in-Jar: a consumer resolving the raw POM would end up with a second copy of
                // something the jar already carries. The first external consumer hit exactly this.
                //
                // ONE EXCEPTION, and it is not a loophole — it is the rule applied correctly.
                // mc_stagewright-attached is nested in NOTHING. It is a plain-JVM library holding the
                // types on this module's own public surface (Expect, SceneFailure, SceneOutcome,
                // Clock, Terrain, Canary); the loader jars shadow-bundle it for RUNTIME, and a
                // consumer needs it at COMPILE time to see those types at all. Stripping it does not
                // prevent a duplicate, it makes `mc_stagewright-api` fail to compile against for
                // every consumer that has not separately guessed the coordinate.
                pom.withXml {
                    def deps = asNode().dependencies
                    if (!deps.isEmpty()) {
                        def block = deps.first()
                        block.dependency
                                .findAll { it.artifactId.text() != 'mc_stagewright-attached' }
                                .each { block.remove(it) }
                        if (block.dependency.isEmpty()) asNode().remove(block)
                    }
                }
            }
        }

        // artifactId must be resolved AFTER the subproject's own build script has run: this
        // subprojects{} block executes BEFORE child scripts, so an eager archivesName.get()
        // here would capture the root default instead of each module's override.
        afterEvaluate {
            publishing.publications.named('mavenJava') {
                artifactId = base.archivesName.get()
            }
        }

        // Gradle consumers prefer .module metadata over the POM, and the runtimeElements
        // variant would leak the dependencies the POM deliberately strips.
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }

        repositories {
            mavenLocal()
        }
    }
}

// ---- Release order ----
// The bootstrap sequence is the one in the header of this file. It is written out, with the
// reason each step is needed and the artifacts each one produces, in docs/reference/publishing.md.
// A shorter sequence used to be given here and was wrong: it omitted the engine build, the Gradle
// plugin, the attached module and the bootstrap property, and so failed on a clean machine.
