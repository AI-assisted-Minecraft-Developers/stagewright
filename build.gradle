// Every module applies its own convention plugin from build-logic/; see docs/reference/publishing.md for the
// layout and the order a clean machine publishes in.
plugins {
    // Declared here, applied only by the Minecraft-side modules. Loom 1.13 is the newest that runs on Gradle 8.
    id 'fabric-loom' version '1.13.6' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    // Shadow 9: 8.x unpacks the nested jars ModDevGradle's jarJar adds to the NeoForge jar.
    id 'com.gradleup.shadow' version '9.2.2' apply false
    id 'stagewright.version'
    id 'stagewright.lint'
}

// For the formatter's own dependencies.
repositories {
    mavenCentral()
}

group = maven_group
version = stagewrightVersion
