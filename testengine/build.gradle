// The outer JUnit Platform engine, id `stagewright`. See docs/design/test-engine.md.
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'stagewright.license'
    id 'stagewright.nexus'
    id 'stagewright.lint'
}

group = 'net.magicterra'
version = rootProject.stagewrightVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
}

configurations {
    // The supervision agent, carried as a resource: a game loads it from a file, with -javaagent.
    bundledAgent { transitive = false }
    // Rhino, relocated into the jar to read script tests (docs/design/test-engine.md, "Script tests").
    bundledRhino { transitive = false }
    compileOnly.extendsFrom bundledRhino
    testImplementation.extendsFrom bundledRhino
}

dependencies {
    implementation project(':')
    bundledAgent project(':stagewright-agent')

    // The JUnit the game runs; the Test task that loads this engine brings its own launcher.
    implementation platform('org.junit:junit-bom:5.11.3')
    implementation 'org.junit.platform:junit-platform-engine'
    // Reads test classes without loading them: their signatures name Minecraft, which is not here.
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation "org.yaml:snakeyaml:${rootProject.snakeyamlVersion}"
    bundledRhino "dev.latvian.mods:rhino:${rootProject.rhinoVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.platform:junit-platform-testkit'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

def stageBundledAgent = tasks.register('stageBundledAgent', Copy) {
    from configurations.bundledAgent
    into layout.buildDirectory.dir('bundled-agent')
    rename(/^stagewright-agent-.*\.jar$/, 'stagewright-agent.jar')
}
tasks.named('processResources') { into('agent') { from stageBundledAgent } }

tasks.named('test', Test) {
    useJUnitPlatform {
        // The fixtures under test are found by this engine, run from the tests through the test kit.
        excludeEngines 'stagewright'
    }
    systemProperty 'stagewright.testClasses', sourceSets.test.output.classesDirs.asPath
    // The fixtures are only read by name; Jupiter must not run them itself.
    exclude 'net/magicterra/stagewright/testengine/fixtures/**'
}

// The relocated jar is the artifact, for consumers and the POM alike; the plain one stays behind.
// Shadow unpacks any jar it meets, so the agent is added after it, by a plain Jar task.
def relocated = tasks.named('shadowJar') {
    archiveClassifier = 'relocated'
    // An input to engineJar, never handed out, so kept out of build/libs.
    destinationDirectory = layout.buildDirectory.dir('relocated')
    configurations = [project.configurations.bundledRhino]
    relocate 'dev.latvian.mods.rhino', 'net.magicterra.stagewright.testengine.shadow.rhino'
    exclude 'agent/**'
}
def engineJar = tasks.register('engineJar', Jar) {
    from(zipTree(relocated.flatMap { it.archiveFile }))
    into('agent') { from stageBundledAgent }
    into('META-INF/licenses') { from '../cli/src/main/resources/META-INF/licenses/MPL-2.0.txt' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.named('jar') { archiveClassifier = 'plain' }
tasks.named('assemble') { dependsOn engineJar }
['apiElements', 'runtimeElements'].each { name ->
    configurations.named(name) {
        outgoing.artifacts.clear()
        outgoing.artifact(engineJar)
    }
}
// Shadow's own variant would be a second, identical choice for consumers to trip over.
components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'stagewright-testengine'
        }
    }
    repositories {
        mavenLocal()
    }
}
