// The version every StageWright artifact carries, for all three builds (root, engine, gradle-plugin):
// <base>-build.<n>+<minecraft>. CI sets BUILD_NUMBER to its run number, and a build published
// by hand sets it to 0; without it the build is `local`, which is never published to the Nexus.
// See docs/reference/publishing.md.
def base = '0.1.0'
def buildNumber = providers.environmentVariable('BUILD_NUMBER').orNull
// Refused rather than spliced in: `build.<n>` has to be a SemVer numeric identifier, digits with no
// leading zero, for the version to be valid SemVer and order by run number.
if (buildNumber != null && !(buildNumber ==~ /0|[1-9][0-9]*/)) {
    throw new GradleException("BUILD_NUMBER is '${buildNumber}', but it must be a whole number"
            + " without leading zeros; unset it for a local build")
}
def build = buildNumber ?: 'local'

// The Minecraft line is the root gradle.properties' own.
def rootProperties = new Properties()
new File(buildscript.sourceFile.parentFile.parentFile, 'gradle.properties').withInputStream { rootProperties.load(it) }
ext.stagewrightVersion = "${base}-build.${build}+${rootProperties.minecraft_version}".toString()
ext.junitVersion = rootProperties.junit_version
// -Pworlddriver_version as the root build takes it, so the plugin pairs with the loader jars built beside it.
ext.worlddriverVersion = (findProperty('worlddriver_version') ?: rootProperties.worlddriver_version).toString()

// WorldDriver is required and must be a release StageWright links against:
// the line of worlddriver_version up to its next breaking release (the next minor while it is 0.x).
// Both loaders' metadata declare it, so the loader refuses the pair instead of the mc.test.* verbs
// failing to link at server start, and the Gradle plugin refuses a worldDriverVersion outside it.
// Both bounds end in `-0`, the lowest pre-release of that version: every build is published as a
// pre-release (0.1.0-build.N), which SemVer — and so Fabric — orders below 0.1.0 itself. A numbered
// build raises the floor to itself: StageWright links against what that build added, so an older one
// is refused too (docs/reference/publishing.md, Versions).
ext.worlddriverVersionRange = {
    def m = worlddriverVersion =~ /^(\d+)\.(\d+)\.(\d+)/
    if (!m.find()) throw new GradleException("worlddriver_version is not major.minor.patch: '$worlddriverVersion'")
    int major = m.group(1) as int
    int minor = m.group(2) as int
    def numbered = worlddriverVersion =~ /^\d+\.\d+\.\d+-build\.\d+(?=\+|$)/
    def floor = numbered.find() ? numbered.group() : "${m.group()}-0"
    "[${floor},${major == 0 ? "0.${minor + 1}.0" : "${major + 1}.0.0"}-0)".toString()
}()
ext.rhinoVersion = rootProperties.rhino_version
ext.snakeyamlVersion = rootProperties.snakeyaml_version
